
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS | Web Portal</title>
<style>
:root {
  --bg: #080914;
  --panel: #131629;
  --text: #f3f1ff;
  --muted: #989bb7;
  --accent: #9462ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: -30%;
  z-index: -1;
  background:
    radial-gradient(circle at 30% 30%,
      #6524ad55, transparent 35%),
    radial-gradient(circle at 75% 75%,
      #243c9555, transparent 40%);
  animation: float 14s ease-in-out infinite alternate;
}
@keyframes float {
  to { transform: translate(5%, -5%) rotate(8deg); }
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 7%;
  border-bottom: 1px solid #ffffff15;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 3px;
}
.logo span { color: var(--accent); }
nav button {
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 12px;
  font-size: 15px;
}
nav button:hover { color: white; }
main {
  width: min(850px, 90%);
  margin: 100px auto;
  text-align: center;
}
h1 {
  font-size: clamp(38px, 7vw, 70px);
  margin-bottom: 15px;
}
h1 span { color: var(--accent); }
.subtitle {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.6;
}
.search {
  display: flex;
  padding: 8px;
  background: var(--panel);
  border: 1px solid #ffffff20;
  border-radius: 18px;
  margin: 38px auto;
  box-shadow: 0 0 50px #8a4fff20;
}
.search input {
  flex: 1;
  min-width: 0;
  background: none;
  border: none;
  outline: none;
  color: white;
  font-size: 16px;
  padding: 15px;
}
.search button, .primary {
  border: none;
  border-radius: 12px;
  padding: 15px 25px;
  background: var(--accent);
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.search button:hover, .primary:hover {
  filter: brightness(1.15);
}
h2 { margin-top: 55px; }
.shortcuts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 25px;
}
.shortcut {
  background: #15182b;
  border: 1px solid #ffffff14;
  border-radius: 16px;
  padding: 25px 10px;
  color: white;
  text-decoration: none;
  transition: .2s;
}
.shortcut:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
}
.shortcut .emoji {
  font-size: 30px;
  display: block;
  margin-bottom: 12px;
}
.panel {
  margin: 25px auto;
  padding: 25px;
  background: var(--panel);
  border: 1px solid #ffffff20;
  border-radius: 18px;
}
.hidden { display: none; }
footer {
  text-align: center;
  padding: 30px;
  color: var(--muted);
  font-size: 13px;
}
@media(max-width: 550px) {
  header { padding: 15px; }
  nav button { padding: 6px; }
  main { margin: 65px auto; }
  .shortcuts { grid-template-columns: repeat(2, 1fr); }
  .search button { padding: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">NEX<span>US</span></div>
  <nav>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('apps')">Apps</button>
    <button onclick="showPage('settings')">Settings</button>
  </nav>
</header>

<main>
  <section id="home">
    <h1>Welcome to <span>NEXUS</span></h1>
    <p class="subtitle">
      Your modern web portal.
      Search the web and access your favorite websites.
    </p>

    <form class="search" id="searchForm">
      <input id="address" type="text"
        placeholder="Search Google or enter a URL..."
        autocomplete="off" required>
      <button type="submit">Go →</button>
    </form>

    <h2>Quick Access</h2>
    <div class="shortcuts" id="homeLinks"></div>
  </section>

  <section id="apps" class="hidden">
    <h1>Explore <span>Apps</span></h1>
    <p class="subtitle">
      Your favorite websites in one place.
    </p>
    <div class="shortcuts" id="appLinks"></div>
  </section>

  <section id="settings" class="hidden">
    <h1>NEXUS <span>Settings</span></h1>
    <div class="panel">
      <h2>Accent Color</h2>
      <input type="color" id="accentPicker"
        value="#9462ff">
      <h2>Appearance</h2>
      <button class="primary" id="themeButton">
        Toggle Light / Dark
      </button>
      <p class="subtitle">
        Settings are saved on this browser.
      </p>
    </div>
  </section>
</main>

<footer>
  NEXUS © 2026 | Built with GitHub Pages
</footer>

<script>
const sites = [
  ["🔎", "Google", "https://www.google.com"],
  ["▶️", "YouTube", "https://www.youtube.com"],
  ["💬", "Discord", "https://discord.com"],
  ["🎮", "Roblox", "https://www.roblox.com"],
  ["📚", "Wikipedia", "https://www.wikipedia.org"],
  ["💻", "GitHub", "https://github.com"]
];

function renderLinks(elementId) {
  const container = document.getElementById(elementId);
  container.replaceChildren();

  for (const [emoji, name, url] of sites) {
    const link = document.createElement("a");
    link.className = "shortcut";
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const symbol = document.createElement("span");
    symbol.className = "emoji";
    symbol.textContent = emoji;

    const title = document.createElement("span");
    title.textContent = name;

    link.append(symbol, title);
    container.appendChild(link);
  }
}

renderLinks("homeLinks");
renderLinks("appLinks");

function showPage(page) {
  for (const id of ["home", "apps", "settings"]) {
    document.getElementById(id).classList.toggle(
      "hidden", id !== page
    );
  }
}

document.getElementById("searchForm")
  .addEventListener("submit", function(event) {
    event.preventDefault();

    const value = document.getElementById("address")
      .value.trim();

    if (!value) return;

    let destination;

    if (/^https?:\/\//i.test(value)) {
      destination = value;
    } else if (
      /^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/.*)?$/i
        .test(value)
    ) {
      destination = "https://" + value;
    } else {
      destination =
        "https://www.google.com/search?q=" +
        encodeURIComponent(value);
    }

    try {
      const url = new URL(destination);
      if (!["http:", "https:"].includes(url.protocol)) {
        return;
      }
      window.open(url.href, "_blank", "noopener,noreferrer");
    } catch {
      alert("Please enter a valid website or search.");
    }
  });

const picker = document.getElementById("accentPicker");
const savedAccent = localStorage.getItem("nexusAccent");

if (savedAccent && /^#[0-9a-f]{6}$/i.test(savedAccent)) {
  picker.value = savedAccent;
  document.documentElement.style.setProperty(
    "--accent", savedAccent
  );
}

picker.addEventListener("input", function() {
  document.documentElement.style.setProperty(
    "--accent", picker.value
  );
  localStorage.setItem("nexusAccent", picker.value);
});

let lightMode = localStorage.getItem("nexusLight") === "true";

function applyTheme() {
  document.documentElement.style.setProperty(
    "--bg", lightMode ? "#f0f1fa" : "#080914"
  );
  document.documentElement.style.setProperty(
    "--panel", lightMode ? "#ffffff" : "#131629"
  );
  document.documentElement.style.setProperty(
    "--text", lightMode ? "#17182b" : "#f3f1ff"
  );
  document.querySelectorAll(".shortcut").forEach(el => {
    el.style.background = lightMode ? "#ffffff" : "#15182b";
    el.style.color = lightMode ? "#17182b" : "#ffffff";
  });
  document.querySelector(".search input").style.color =
    lightMode ? "#17182b" : "#ffffff";
}

document.getElementById("themeButton")
  .addEventListener("click", function() {
    lightMode = !lightMode;
    localStorage.setItem("nexusLight", lightMode);
    applyTheme();
  });

applyTheme();
</script>
</body>
</html>
